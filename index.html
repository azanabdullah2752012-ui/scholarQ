<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarQ | Peer Learning</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="clean-theme">
    <!-- Auth & Role Setup -->
    <div id="view-auth" class="auth-overlay" style="display:none;">
        <div class="auth-modal">
            <div class="brand-minimal">Scholar<span>Q</span></div>
            <p id="auth-sub" class="text-muted">Academic Help. Organized.</p>
            
            <form id="auth-form">
                <input type="email" id="auth-email" placeholder="School Email" class="input-field" required>
                <input type="password" id="auth-password" placeholder="Password" class="input-field" required>
                
                <div id="role-fields" style="display:none; margin-top:16px; border-top:1px solid #eee; padding-top:16px;">
                    <input type="text" id="auth-name" placeholder="Full Name" class="input-field">
                    <input type="number" id="auth-score" placeholder="Recent Score %" class="input-field" min="0" max="100">
                    <p class="text-xs">Scholars (85%+) get answering privileges.</p>
                </div>
                
                <button type="submit" id="auth-btn" class="btn-main">Enter Platform</button>
                <button type="button" onclick="toggleAuthMode()" class="btn-link" id="auth-toggle">New here? Create Account</button>
            </form>
        </div>
    </div>

    <!-- App Shell -->
    <div id="app" style="display:none;">
        <header class="navbar">
            <div class="nav-container">
                <div class="brand-minimal" onclick="go('home')">Scholar<span>Q</span></div>
                <div class="nav-right">
                    <button id="btn-ask-nav" class="btn-main-sm" onclick="go('ask')">Ask Doubt</button>
                    <div class="user-trigger" onclick="go('profile')">
                        <div id="nav-avatar" class="avatar-circle">A</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="content-limit">
            <!-- Role Bar -->
            <div id="role-banner" class="role-banner">
                <span id="role-label" class="badge">STUDENT</span>
                <span id="role-stats" class="text-muted text-sm">Welcome back, Scholar.</span>
            </div>

            <!-- Home View -->
            <div id="view-home" class="view">
                <div class="view-header">
                    <h2>Recent Doubts</h2>
                    <div class="subject-filters" id="subject-filters">
                        <button class="chip active" onclick="setFilter('All')">All</button>
                        <button class="chip" onclick="setFilter('Math')">Math</button>
                        <button class="chip" onclick="setFilter('Science')">Science</button>
                        <button class="chip" onclick="setFilter('English')">English</button>
                    </div>
                </div>
                <div id="home-feed" class="stack"></div>
            </div>

            <!-- Ask View -->
            <div id="view-ask" class="view" style="display:none;">
                <div class="view-header">
                    <h2>Ask your Doubt</h2>
                </div>
                <form id="ask-form" class="card-form">
                    <input type="text" id="ask-title" placeholder="Title (e.g. Help with Quadratic Equations)" class="input-field" required>
                    <select id="ask-subject" class="input-field">
                        <option>Math</option><option>Science</option><option>Physics</option><option>History</option><option>CS</option>
                    </select>
                    <textarea id="ask-body" placeholder="Describe your doubt in detail..." class="input-field" style="min-height:150px;" required></textarea>
                    <button type="submit" class="btn-main">Post Doubt</button>
                </form>
            </div>

            <!-- Detail View -->
            <div id="view-question" class="view" style="display:none;">
                <div id="qd-container"></div>
                <div class="answers-section">
                    <h3 id="ans-count">Answers</h3>
                    <div id="qd-answers" class="stack"></div>
                </div>
                <div id="answer-box" class="answer-box">
                    <h3>Submit Solution</h3>
                    <form id="answer-form">
                        <textarea id="answer-body" placeholder="Write your solution clearly..." class="input-field" required></textarea>
                        <button type="submit" class="btn-main">Submit Answer</button>
                    </form>
                </div>
            </div>

            <!-- Profile View -->
            <div id="view-profile" class="view" style="display:none;">
                <div id="profile-card" class="profile-card"></div>
                <button onclick="logout()" class="btn-outline" style="margin-top:24px;">Logout</button>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>

    <script src="app.js?v=200"></script>
</body>
</html>
