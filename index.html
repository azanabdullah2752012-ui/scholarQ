<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarQ | Student Hub</title>
    <link rel="stylesheet" href="styles.css?v=112">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="toast-container"></div>

    <div id="app">
        <!-- SIMPLE TOP NAV -->
        <header id="top-nav" style="display:none;">
            <div class="container" style="display:flex; justify-content:space-between; align-items:center; padding:20px 0;">
                <h1 style="font-size:1.5rem; font-weight:800; color:var(--p-500); cursor:pointer;" onclick="navigateTo('home')">ScholarQ</h1>
                <div style="display:flex; gap:20px; align-items:center;">
                    <span id="nav-points" style="font-weight:700; font-size:0.9rem;">0 PTS</span>
                    <button onclick="navigateTo('profile')" class="btn-icon"><i data-lucide="user"></i></button>
                    <button onclick="logout()" class="btn-icon" style="color:#ef4444;"><i data-lucide="log-out"></i></button>
                </div>
            </div>
        </header>

        <main class="container">
            <!-- VIEW: AUTH -->
            <div id="view-auth" class="view" style="display:none;">
                <div class="auth-card">
                    <h1 style="margin-bottom:8px;">Welcome Back</h1>
                    <p style="color:var(--text-secondary); margin-bottom:32px;">The student-first academic hub.</p>
                    <form id="auth-form" style="display:flex; flex-direction:column; gap:16px;">
                        <input type="email" id="auth-email" placeholder="Email" class="input-basic" required>
                        <input type="password" id="auth-password" placeholder="Password" class="input-basic" required>
                        <button type="submit" class="btn-primary">Access Portal</button>
                    </form>
                    <button onclick="signInWithGoogle()" class="btn-google" style="margin-top:16px;">Google Login</button>
                    <p style="margin-top:24px; font-size:0.8rem; color:var(--text-secondary); text-align:center;">Don't have an account? Just sign in to register.</p>
                </div>
            </div>

            <!-- VIEW: HOME (DOUBTS HUB) -->
            <div id="view-home" class="view" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
                    <div>
                        <h2 style="font-size:2rem; font-weight:800;">Academic Feed</h2>
                        <p style="color:var(--text-secondary);">Help your peers, earn points, and learn.</p>
                    </div>
                    <button onclick="navigateTo('ask')" class="btn-primary">+ New Question</button>
                </div>
                <div id="home-feed"></div>
            </div>

            <!-- VIEW: ASK -->
            <div id="view-ask" class="view" style="display:none;">
                <div class="card-basic" style="max-width:600px; margin:0 auto;">
                    <h2 style="margin-bottom:24px;">What's your question?</h2>
                    <form id="ask-form" style="display:flex; flex-direction:column; gap:16px;">
                        <input type="text" id="ask-title" placeholder="Question Title" class="input-basic" required>
                        <select id="ask-subject" class="input-basic">
                            <option value="Math">Mathematics</option>
                            <option value="Science">Science</option>
                            <option value="History">History</option>
                            <option value="General">General</option>
                        </select>
                        <textarea id="ask-body" placeholder="Provide some context..." class="input-basic" style="min-height:150px;"></textarea>
                        <button type="submit" class="btn-primary">Post Question</button>
                        <button type="button" onclick="navigateTo('home')" class="btn-ghost">Cancel</button>
                    </form>
                </div>
            </div>

            <!-- VIEW: QUESTION DETAIL -->
            <div id="view-question" class="view" style="display:none;">
                <button onclick="navigateTo('home')" class="btn-ghost" style="margin-bottom:24px;">← Back to Feed</button>
                <div id="qd-content" class="card-basic" style="margin-bottom:32px;"></div>
                <div id="qd-answers"></div>
                <div class="card-basic" style="margin-top:32px;">
                    <h3 style="margin-bottom:16px;">Submit your answer</h3>
                    <form id="answer-form" style="display:flex; flex-direction:column; gap:16px;">
                        <textarea id="answer-body" placeholder="Write a helpful explanation..." class="input-basic" style="min-height:120px;" required></textarea>
                        <button type="submit" class="btn-primary" style="align-self:flex-end;">Post Answer</button>
                    </form>
                </div>
            </div>

            <!-- VIEW: PROFILE -->
            <div id="view-profile" class="view" style="display:none;">
                <div class="card-basic" style="text-align:center; max-width:500px; margin:0 auto;">
                    <div id="profile-initial" style="width:80px; height:80px; background:var(--p-500); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:2rem; font-weight:800; margin-bottom:20px;">A</div>
                    <h2 id="profile-name">Student Name</h2>
                    <p id="profile-email" style="color:var(--text-secondary); margin-bottom:32px;">email@example.com</p>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; border-top:1px solid var(--border); padding-top:32px;">
                        <div><div id="profile-points" style="font-size:1.5rem; font-weight:800;">0</div><div style="font-size:0.7rem; opacity:0.6;">POINTS</div></div>
                        <div><div id="profile-questions" style="font-size:1.5rem; font-weight:800;">0</div><div style="font-size:0.7rem; opacity:0.6;">QUESTIONS</div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js?v=112"></script>
</body>
</html>
