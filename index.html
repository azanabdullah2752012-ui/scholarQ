<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarQ | Master OS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="vision-theme">
    <div id="init-shield" class="init-shield">
        <div class="shield-content">
            <div class="brand-logo"><i data-lucide="graduation-cap"></i> ScholarQ</div>
            <div class="loading-line"></div>
        </div>
    </div>

    <!-- Auth -->
    <div id="view-auth" class="auth-overlay" style="display:none;">
        <div class="auth-card">
            <div class="brand-logo" style="justify-content:center; margin-bottom:12px;"><i data-lucide="graduation-cap"></i> ScholarQ</div>
            <form id="auth-form" class="stack-sm">
                <input type="email" id="auth-email" placeholder="Institutional Email" class="input-sq" required>
                <input type="password" id="auth-password" placeholder="Password" class="input-sq" required>
                <div id="role-fields" style="display:none; margin-top:16px;">
                    <input type="text" id="auth-name" placeholder="Full Name" class="input-sq">
                    <input type="number" id="auth-score" placeholder="Academic Score %" class="input-sq" min="0" max="100">
                </div>
                <button type="submit" id="auth-btn" class="btn-primary">Sign In</button>
                <button type="button" onclick="toggleAuthMode()" class="btn-link" id="auth-toggle">New here? Register</button>
            </form>
        </div>
    </div>

    <!-- App Shell -->
    <div id="app" class="app-layout" style="display:none; opacity:0;">
        <aside class="sidebar">
            <div class="brand-logo" onclick="go('home')"><i data-lucide="graduation-cap"></i> <div>ScholarQ<div class="brand-sub">Teach. Help. Lead.</div></div></div>
            
            <nav id="sidebar-nav" class="side-nav"></nav>

            <div id="sidebar-status-area"></div>

            <div class="side-footer" onclick="logout()">
                <i data-lucide="moon"></i> <span>Dark Mode</span>
            </div>
        </aside>

        <main class="main-workspace">
            <header class="top-bar">
                <div class="search-wrap">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="Search doubts, subjects or topics..." oninput="handleSearch(this.value)">
                </div>
                <button class="btn-ask-top" onclick="go('ask')"><i data-lucide="edit-3"></i> Ask Doubt</button>
            </header>

            <div class="workspace-content">
                <div id="view-home" class="view"></div>
                
                <!-- Common Views -->
                <div id="view-ask" class="view" style="display:none;">
                    <div class="greeting"><h1>Broadcast Doubt</h1></div>
                    <form id="ask-form" class="form-card">
                        <div class="f-group"><label>TITLE</label><input type="text" id="ask-title" placeholder="Summary of your doubt" required></div>
                        <div class="f-group"><label>SUBJECT</label><select id="ask-subject"><option>Mathematics</option><option>Chemistry</option><option>Physics</option><option>History</option><option>Biology</option></select></div>
                        <div class="f-group"><label>DESCRIPTION</label><textarea id="ask-body" placeholder="Describe the problem clearly..." style="min-height:200px;" required></textarea></div>
                        <button type="submit" class="btn-primary">Post Doubt</button>
                    </form>
                </div>

                <div id="view-question" class="view" style="display:none;">
                    <div id="qd-container" class="form-card mb-32"></div>
                    <div id="qd-answers" class="feed-stack"></div>
                    <div id="answer-box" class="form-card mt-32">
                        <h3>Submit Solution</h3>
                        <form id="answer-form">
                            <textarea id="answer-body" placeholder="Provide a detailed solution..." style="min-height:150px;" required></textarea>
                            <button type="submit" class="btn-primary">Submit Answer</button>
                        </form>
                    </div>
                </div>

                <div id="view-profile" class="view" style="display:none;">
                    <div class="form-card text-center">
                        <div id="p-avatar" class="profile-avatar">A</div>
                        <h2 id="p-name">Scholar Name</h2>
                        <div class="p-stats-row">
                            <div class="p-stat"><div id="p-total" class="p-val">0</div><div class="p-label">ANSWERS</div></div>
                            <div class="p-stat"><div id="p-best" class="p-val">0</div><div class="p-label">BEST ANSWERS</div></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <aside id="right-panel" class="right-panel"></aside>
    </div>

    <div id="toast-container"></div>
    <script src="app.js?v=301"></script>
</body>
</html>
